server {
    listen 80;
    server_name __ERP_DOMAIN__;
    client_max_body_size 12m;
    location /static/ { alias /var/www/erp/app/staticfiles/; expires 7d; }
    # Galereya: telefondan bir yo'la ko'p rasm (60 tagacha, har biri 3-8 MB) — katta so'rov va uzoqroq ishlov
    location ~ ^/(panel|ustoz)/galereya/ {
        client_max_body_size 400m;
        include proxy_params;
        proxy_pass http://127.0.0.1:8010;
        proxy_read_timeout 300s;
    }
    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:8010;
        proxy_read_timeout 60s;
    }
}
