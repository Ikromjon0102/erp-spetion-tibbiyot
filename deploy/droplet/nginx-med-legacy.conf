# med.spetion.uz — eski manzil (ota-ona va ustozlarga tarqatilgan). Ko'chirish kuni DNS yangi serverga o'tgach ishlatiladi.
#  * Terminallar (Hikvision HTTP push) va Telegram webhook yo'naltirishga (301) ergashmaydi — ular shu yerda TO'G'RIDAN-TO'G'RI
#    ilovaga uzatiladi, shuning uchun terminallarni qayta sozlash shart emas.
#  * Qolgan hamma sahifa my.spetion.uz ga yo'li bilan yo'naltiriladi (havolalar va o'rnatilgan ilova ishlayveradi).
# Sertifikat: DNS o'tishidan OLDIN eski serverdagi med.spetion.uz sertifikati nusxalanadi (uzilish bo'lmasin), keyin certbot yangilaydi.
server {
    listen 443 ssl;
    server_name med.spetion.uz;
    ssl_certificate /etc/letsencrypt/live/med.spetion.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/med.spetion.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 12m;

    location /api/access/ {            # terminal voqealari
        include proxy_params;
        proxy_pass http://127.0.0.1:8010;
        proxy_read_timeout 60s;
    }
    location /tg/webhook/ {            # Telegram webhook (Mini App /tg/app/ esa my.spetion.uz ga o'tadi — sessiya o'sha domenda bo'lsin)
        include proxy_params;
        proxy_pass http://127.0.0.1:8010;
        proxy_read_timeout 60s;
    }
    location / {
        return 301 https://my.spetion.uz$request_uri;
    }
}
server {
    listen 80;
    server_name med.spetion.uz;
    location /api/access/ {            # terminal HTTP (443 emas) bilan sozlangan bo'lsa ham ishlasin
        include proxy_params;
        proxy_pass http://127.0.0.1:8010;
    }
    location / { return 301 https://my.spetion.uz$request_uri; }
}
