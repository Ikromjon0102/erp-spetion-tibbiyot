# med.spetion.uz (certbot --nginx shu faylga HTTPS qismini o'zi qo'shadi)
server {
    listen 80;
    server_name med.spetion.uz;

    client_max_body_size 12m;      # yuz rasmlari (10 MB gacha) va Excel yuklash

    location /static/ {
        alias /var/www/med-spetion/app/staticfiles/;
        expires 7d;
    }

    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:8010;
        proxy_read_timeout 60s;
    }
}
