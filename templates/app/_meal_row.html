<div class="row meal-row" data-meal="{{ l.key }}" data-start="{{ l.start }}" data-end="{{ l.end }}">
  <span class="mi"><svg class="ic"><use href="#i-meal"/></svg></span>
  <div class="time">{{ l.start }}<small>{{ l.end }}</small></div>
  <div class="info"><b>{{ l.subject }}</b><small>{{ l.teacher }}</small></div>
  <span class="mchip">Menyu</span>
  <span class="tag-now" hidden>HOZIR</span>
</div>
