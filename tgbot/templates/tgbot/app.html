<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maktab</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px system-ui,sans-serif;
       background:var(--tg-theme-bg-color,#f4f6fb);color:var(--tg-theme-text-color,#1b2230);text-align:center;padding:24px}
  .sp{width:34px;height:34px;border:3px solid #9aa7bd55;border-top-color:#4a7cff;border-radius:50%;animation:r 1s linear infinite;margin:0 auto 14px}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div><div class="sp" id="sp"></div><p id="msg">Yuklanmoqda…</p></div>
<script>
  var tg = window.Telegram && Telegram.WebApp, msg = document.getElementById('msg');
  function fail(t){ document.getElementById('sp').style.display = 'none'; msg.textContent = t; }
  if (!tg || !tg.initData) {
    fail("Bu sahifa faqat Telegram ichidagi bot orqali ochiladi.");
  } else {
    tg.ready(); tg.expand();
    fetch('{% url "tg_auth" %}', {method: 'POST', credentials: 'same-origin',
          headers: {'Content-Type': 'application/x-www-form-urlencoded'},
          body: 'initData=' + encodeURIComponent(tg.initData)})
      .then(function (r) { if (r.ok) location.replace('/'); else fail("Avval botda /start bosib, telefon raqamingizni ulang."); })
      .catch(function () { fail("Ulanib bo'lmadi. Keyinroq urinib ko'ring."); });
  }
</script>
</body>
</html>
