<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maktab</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;
       background:var(--tg-theme-bg-color,#F2F9F4);color:var(--tg-theme-text-color,#0E2217);text-align:center;padding:24px}
  .logo svg{height:30px;width:auto;display:block;margin:0 auto 22px} .logo svg path{fill:#166534}
  .sp{width:36px;height:36px;border:3px solid rgba(22,101,52,.18);border-top-color:#166534;border-radius:50%;animation:r 1s linear infinite;margin:0 auto 14px}
  #msg{margin:0;max-width:300px;color:var(--tg-theme-hint-color,#53695B);font-weight:500}
  @keyframes r{to{transform:rotate(360deg)}}
  @media (prefers-color-scheme:dark){ .logo svg path{fill:#86E0A6} .sp{border-color:rgba(134,224,166,.2);border-top-color:#86E0A6} }
</style>
</head>
<body>
<div><div class="logo">{% include 'teacher/_logo.svg' %}</div><div class="sp" id="sp"></div><p id="msg">Yuklanmoqda…</p></div>
<script>
  var tg = window.Telegram && Telegram.WebApp, msg = document.getElementById('msg');
  function fail(t){ document.getElementById('sp').style.display = 'none'; msg.textContent = t; }
  if (!tg || !tg.initData) {
    fail("Bu sahifa faqat Telegram ichidagi bot orqali ochiladi.");
  } else {
    tg.ready(); tg.expand();
    fetch('{% url "tg_auth" %}', {method: 'POST', credentials: 'same-origin',
          headers: {'Content-Type': 'application/x-www-form-urlencoded'},
          body: 'initData=' + encodeURIComponent(tg.initData)})
      .then(function (r) { if (r.ok) location.replace("{{ next|escapejs }}"); else fail("Avval botda /start bosib, telefon raqamingizni ulang."); })
      .catch(function () { fail("Ulanib bo'lmadi. Keyinroq urinib ko'ring."); });
  }
</script>
</body>
</html>
